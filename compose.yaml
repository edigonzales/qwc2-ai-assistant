name: qwc2-ai-assistant
services:
  assistant:
    build:
      context: .
      dockerfile: assistant/Dockerfile
    environment:
      INFOMANIAK_API_TOKEN: ${INFOMANIAK_API_TOKEN:-}
      INFOMANIAK_PRODUCT_ID: ${INFOMANIAK_PRODUCT_ID:-}
      INFOMANIAK_MODEL: ${INFOMANIAK_MODEL:-}
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8083}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  qwc:
    build: .
    environment:
      ASSISTANT_API_ORIGIN: http://assistant:8080
    depends_on:
      - assistant
    ports:
      - "127.0.0.1:${QWC_PORT:-8082}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
